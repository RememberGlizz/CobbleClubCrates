name: Import CobbleClub Crates source

on:
  push:
    branches:
      - main
    paths:
      - '.source-import/**'
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild source tree
        shell: bash
        run: |
          cat .source-import/part* | base64 --decode > /tmp/cobbleclub-crates-source.tar.xz
          shopt -s dotglob nullglob
          for item in * .*; do
            case "$item" in
              .|..|.git) continue ;;
            esac
            rm -rf -- "$item"
          done
          tar -xJf /tmp/cobbleclub-crates-source.tar.xz -C .

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import CobbleClub Crates 2.1.1 source for Cobblemon 1.8.0"
          git push origin HEAD:${GITHUB_REF_NAME}
